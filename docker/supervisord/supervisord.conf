[supervisord]
nodaemon=true
user=laravel
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:laravel]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan serve --host=0.0.0.0 --port=8000
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --queue=preorders,default --sleep=3 --tries=3 --timeout=90
autostart=false
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; A worker for pre-order jobs only (webhooks to the provider panel), so a long default queue
; never delays them. The main worker above also takes them first when this one isn't running.
[program:laravel-queue-preorders]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --queue=preorders --sleep=1 --tries=3 --timeout=90
autostart=false
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
